name: ARM64 UOS package
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ee70b88d370472f18ad8585c41c6a3e75e7daffb
          persist-credentials: false
      - name: Build for glibc 2.28
        shell: bash
        run: |
          set -eu
          docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux_2_28_aarch64 bash -ec '
            dnf install -y alsa-lib-devel perl-core
            curl -fsSLo /tmp/rustup.sh https://sh.rustup.rs
            sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            export VERA20K_COMMIT=ee70b88d370472f18ad8585c41c6a3e75e7daffb
            cargo build --release --locked -p vera20k --no-default-features --bin vera20k
            strip target/release/vera20k
            ldd target/release/vera20k | tee /tmp/libs
            ! grep -q "not found" /tmp/libs
            getconf GNU_LIBC_VERSION
            readelf -W --version-info target/release/vera20k > /tmp/versions
            max=$(grep -oE "GLIBC_[0-9.]+" /tmp/versions | sort -Vu | tail -1)
            echo "Maximum symbol version: $max"
            test "$(printf "%s\n" "$max" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uos-arm64-engine
          path: target/release/vera20k
          retention-days: 2
